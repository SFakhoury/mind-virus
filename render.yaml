services:
  - type: web
    name: mind-virus-staging
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: MIND_VIRUS_HOST
        value: 0.0.0.0
      - key: MIND_VIRUS_ACCESS_TOKEN
        generateValue: true
      - key: MIND_VIRUS_MODEL
        value: gpt-5.6-luna
    disk:
      name: mind-virus-staging-data
      mountPath: /app/results
      sizeGB: 1
