<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mind-Virus Town</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><h1>MIND-VIRUS <span>RESEARCH TOWN</span></h1><p>Watch information move differently from belief</p></div>
    <div class="clock" id="clock">DAY 01 · 08:00</div>
  </header>
  <main>
    <section class="stage">
      <canvas id="town" aria-label="Animated town simulation"></canvas>
      <div class="controls"><button id="toggle">Pause</button><button id="reset" class="secondary">Reset</button></div>
    </section>
    <aside>
      <section class="card claim-card"><div class="eyebrow" id="claim-status">ACTIVE CLAIM · GENERATION 0</div><blockquote>“The bakery is giving away free bread today.”</blockquote><p class="legend"><i class="key baseline-key"></i> Baseline &nbsp; <i class="key skeptic-key"></i> Skeptical treatment</p></section>
      <section class="card"><h2>Propagation</h2><div class="metrics"><div><strong id="exposed">1</strong><small>EXPOSED</small></div><div><strong id="believers">0</strong><small>BELIEVERS</small></div><div><strong id="repeats">0</strong><small>REPETITIONS</small></div><div><strong id="generation">0</strong><small>GENERATION</small></div></div></section>
      <section class="card"><h2>Residents</h2><div id="agents"></div></section>
      <section class="card conversation-card"><h2>Conversation transcript</h2><div id="log" class="log"></div></section>
    </aside>
  </main>
  <script src="town.js"></script>
</body>
</html>
